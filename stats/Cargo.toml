[package]
name = "btc-data-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stats accumulators (lib) + btc-data-stats CLI binary that runs the scan loop and emits per-block stats to configurable sinks."

[lib]
path = "src/lib.rs"

[[bin]]
name = "btc-data-stats"
path = "src/bin/main.rs"

[dependencies]
btc-data-core.workspace = true
btc-data-sources.workspace = true

anyhow.workspace = true
async-trait.workspace = true
sha2.workspace = true
bitcoin.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
futures.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
postcard.workspace = true
ahash.workspace = true
hashbrown.workspace = true

[features]
default = []
ipc = ["btc-data-sources/ipc"]
